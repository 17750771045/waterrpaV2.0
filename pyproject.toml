[project]
name = "waterRPA"
version = "1.0.0"
description = "Water RPA Automation Tool"
authors = [
    {name = "Developer", email = "dev@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.5.0",
    "pyperclip>=1.8.2",
    "Pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "psutil>=5.9.0",
    "pyinstaller>=5.13.0",
    "pywin32>=311",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
